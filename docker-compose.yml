services:
  db:
    image: postgres:16-alpine
    container_name: gendarmerie-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gendarmerie_militaire}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gendarmerie-net

  app:
    build: .
    container_name: gendarmerie-app
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-gendarmegestionmilitaire}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - gendarmerie-net

  web:
    image: nginx:alpine
    container_name: gendarmerie-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8098}:8098"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gendarmerie-net

volumes:
  pgdata:
    driver: local

networks:
  gendarmerie-net:
    driver: bridge
