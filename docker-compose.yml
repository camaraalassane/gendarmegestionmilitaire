services:
  app:
    build: .
    container_name: gendarmerie-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - gendarmerie-net

  web:
    image: nginx:alpine
    container_name: gendarmerie-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8098}:8098"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gendarmerie-net

networks:
  gendarmerie-net:
    driver: bridge
